[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab5-flask-user-app"
version = "1.0.0"
description = "EECE435L Lab 5 Flask and SQLite user management API"
requires-python = ">=3.9"
dependencies = [
    "Flask==3.1.3",
    "Flask-Cors==6.0.2",
]

[tool.setuptools]
py-modules = ["app", "database"]
